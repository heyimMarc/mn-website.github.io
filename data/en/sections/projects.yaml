buttons:
- name: All
  filter: "all"

projects:
- name: Event Sourcing on PostgreSQL
  role: Author
  timeline: "2026"
  repo: https://github.com/heyimMarc/event-sourcing-postgres-example
  summary: A working event store on plain PostgreSQL, without a broker, an ORM or a framework. One table, one aggregate, plain JDBC, optimistic concurrency on the stream version, snapshots, and a Testcontainers suite that runs against a real database. Companion code to the article of the same name.
  tags: ["professional", "event-sourcing", "postgresql", "java"]

- name: Transactional Outbox on PostgreSQL
  role: Author
  timeline: "2026"
  repo: https://github.com/heyimMarc/transactional-outbox-postgres-example
  summary: Business state and the outgoing message committed in the same transaction, then relayed to a broker with FOR UPDATE SKIP LOCKED so two relays can run without publishing anything twice. Tests cover rollback, broker outage and concurrent relays.
  tags: ["professional", "messaging", "postgresql", "java"]
