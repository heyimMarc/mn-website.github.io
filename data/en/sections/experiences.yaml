    location: Remote
    logo: /images/sections/experiences/xpertz.svg
    overview: WBA is my own three-founder company. Its product Pitchtri is a talent-management platform that lets tech recruiters manage, compare and match IT freelancer profiles to projects.
  positions:
  - designation: Co-Founder & Software Architect
    start: 2020
    responsibilities:
    - Co-founded the company; responsible for product architecture and delivery end to end, from domain model to production operations
    - Designed the microservice landscape (auth, profile, projects, contracts, billing, mail, realtime and API gateway), built in Java with Micronaut and GraalVM native-image support, Angular frontend
    - Contract-first APIs with OpenAPI 3 and generated clients, event-driven service integration via Kafka
    - Full platform runs on a self-hosted Kubernetes cluster (Traefik ingress, PostgreSQL, Valkey, MinIO, GitLab CI with GitOps deployments)
