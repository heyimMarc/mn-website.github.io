# Your experiences
experiences:
- company:
    name: ista SE
    url: "https://www.ista.com"
    location: Essen
    logo: /images/sections/experiences/ista.png
    # Can optionally show a different logo for dark theme
    # darkLogo: /images/sections/experiences/company1.jpg
    # company overview
    overview: ista SE is one of the leading energy service providers, helping apartment buildings and commercial properties become more energy efficient.
  positions:
  - designation: Senior Backend Engineer (Kotlin / Java)
    start: May 2025
    responsibilities:
    - Contributed to a greenfield, event-sourced platform that serves as the system of record for property units and the full lifecycle of their metering devices (installation, replacement, removal)
    - Part of the team building the backend in Kotlin on Spring Boot 4 / Java 25, running in production on Azure Kubernetes Service
    - Domain-Driven Design enforced at build time (hexagonal architecture and DDD building blocks validated by jMolecules and ArchUnit), so an architecture violation fails the pipeline instead of slipping through review
    - Event Sourcing and CQRS on a PostgreSQL event store (state is rebuilt by replaying domain events), which gives a complete and auditable history of every device change instead of overwritten rows
    - Anti-Corruption Layer that keeps the core domain clean (consumes work orders from Azure Service Bus, validates and transforms legacy formats into domain events, and integrates SAP via OData and SOAP)
    - Contract-first API design with OpenAPI 3 and JSON Schema as the single source of truth; API clients and event classes are generated from the contracts, so services cannot drift apart
    - Testing across the pyramid (unit and integration tests with JUnit 5, Mockito, WireMock and Testcontainers, plus a Cucumber / REST Assured BDD suite that verifies business processes end to end)
    - GitOps delivery (GitLab CI builds and versions the service, ArgoCD syncs Helm charts to AKS; SonarQube, Spotless and OpenRewrite gate every merge)
    - AI-assisted development as part of daily delivery (Claude Code with custom agent skills and automated review loops for code review, test generation and repetitive refactorings), with every change still reviewed by a human before merge
    - Kotlin, Java 25, Spring Boot 4, Event Sourcing, CQRS, DDD, Hexagonal Architecture, PostgreSQL, Flyway, Azure Service Bus, CloudEvents, SAP OData/SOAP, Docker, Kubernetes (AKS), Helm, ArgoCD, Terraform, GitLab CI, JUnit, Mockito, Testcontainers, WireMock, Cucumber, OpenAPI 3, Maven, Claude Code

  - designation: DevOps Engineer
    start: March 2025
    end: May 2025
    responsibilities:
    - Built and maintained the shared CI/CD platform (reusable GitLab CI pipeline templates and Infrastructure-as-Code modules that development squads adopt instead of writing their own)
    - Defined the cloud architecture for centralised and squad-specific DevOps use cases on Azure
    - Set up and operated the development, test and production environments, including the tooling around them
    - Consulted and mentored development teams on their application lifecycle, with a focus on CI/CD
    - Azure, GitLab CI, Terraform, Kubernetes, Helm

  - designation: Fullstack Developer
    start: April 2020
    end: March 2025
    responsibilities:
    - Migrated the service landscape from Docker Swarm to Kubernetes and moved on-premise applications to Azure, while the services kept running for the business that depended on them
    - Replaced manual data consolidation across several source systems with Spring Boot integration services feeding one central system
    - Decoupled services that had been calling each other synchronously, using JMS on ActiveMQ and Spring Batch for the work that belonged in a batch
    - Designed and documented the REST APIs contract-first with OpenAPI 3.0, so the consuming teams stopped guessing
    - Developed the matching Angular frontends and covered the backends with JUnit and Mockito tests
    - Java, Spring Boot, Docker, Kubernetes, Hibernate, Liquibase, Angular, GitLab CI, JUnit, Mockito, Spring Batch, Azure, Maven, MariaDB, PostgreSQL

