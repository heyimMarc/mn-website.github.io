# a summary about you
summary: 'I take Java systems that have grown for a decade and move them onto Kubernetes and event-driven architecture without stopping the business that depends on them. Since 2010 I have built backend platforms in logistics, energy, e-commerce and fintech. Recent years have mostly been migrations: Docker Swarm to Kubernetes and on-premise applications to Azure, plus a legacy work-order feed that got wrapped in an anti-corruption layer instead of a rewrite. Claude Code and custom agent skills are part of how I deliver, with a human reading every change before it merges. Open for freelance projects from January 2027, remote or on-site in NRW.'

